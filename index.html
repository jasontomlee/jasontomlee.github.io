<title>Logo Carousel</title>

<style>
  /* Prevent layout expansion */
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important; /* removed white */
    overflow-x: hidden; /* prevent scrollbars */
    font-family: sans-serif;
  }

  .carousel {
    position: relative;
    width: 100%;
    overflow: hidden; /* contain animation */
    padding: 1rem 0;
    background: transparent;
  }

  /* KEY FIX: inline-flex prevents width expansion */
  .carousel-track {
    display: inline-flex;
    gap: 2rem;
    animation: scroll 20s linear infinite;
    white-space: nowrap;
    will-change: transform;
  }

  .carousel-track img {
    height: 60px;
    flex-shrink: 0;
  }

  /* Transparent fade edges (no white background) */
  .carousel::before,
  .carousel::after {
    content: "";
    position: absolute;
    top: 0;
    width: 100px;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .carousel::before {
    left: 0;
    background: linear-gradient(to right, rgba(255,255,255,0.8), transparent);
  }

  .carousel::after {
    right: 0;
    background: linear-gradient(to left, rgba(255,255,255,0.8), transparent);
  }

  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
