<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Carousel</title>

  <style>
    /* Prevent layout expansion */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .carousel {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 1rem 0;
      background: transparent;
    }

    /* Track */
    .carousel-track {
      display: inline-flex;
      gap: 1.5rem;
      animation: scroll 25s linear infinite;
      white-space: nowrap;
      will-change: transform;
    }

    /* Images */
    .carousel-track img {
      height: 75px;
      flex-shrink: 0;
    }

    /* Fade edges */
    .carousel::before,
    .carousel::after {
      content: "";
      position: absolute;
      top: 0;
      width: 100px;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .carousel::before {
      left: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.3), transparent);
    }

    .carousel::after {
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.3), transparent);
    }

    /* Animation */
    @keyframes scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-33.333%);
      }
    }
  </style>
</head>
