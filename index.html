<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Carousel</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow-x: hidden;
    font-family: sans-serif;
  }

  .carousel {
    position: relative;
    width: 100%;
    overflow: hidden;
    padding: 1.5rem 0;
  }

  /* Track */
  .carousel-track {
    display: flex;
    width: max-content;
    gap: 1.5rem;
    animation: scroll 25s linear infinite;
  }

  /* Pause on hover */
  .carousel:hover .carousel-track {
    animation-play-state: paused;
  }

  /* Images */
  .carousel-track img {
    height: 80px; /* bigger = less visible gaps */
    flex-shrink: 0;
  }

  /* Fade edges (actually transparent-friendly now) */
  .carousel::before,
  .carousel::after {
    content: "";
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .carousel::before {
    left: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.4), transparent);
  }

  .carousel::after {
    right: 0;
    background: linear-gradient(to left, rgba(0,0,0,0.4), transparent);
  }

  /* Smooth infinite scroll */
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
  }
</style>
</head>
